name: Apply remaining audit bugs
on:
  push:
    branches: [fix/remaining-audit-bugs]
    paths:
      - "scripts/audit-fix-parts/**"
      - "scripts/apply_audit_fix.py"
      - ".github/workflows/apply-remaining-audit-bugs.yml"
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remaining-audit-bugs
      - name: Apply sources from parts
        run: python3 scripts/apply_audit_fix.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Calendar.tsx components/Checklist.tsx components/Dashboard.tsx utils/supabaseRealtimeService.ts
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "apply: remaining audit bugs sources (realtime, dedupe, reminders, toasts)"
            git push
          fi
