name: Apply 3-bug checklist/inventory/house fix

on:
  push:
    branches:
      - fix/three-bugs-checklist-inventory-house
    paths:
      - 'scripts/apply-three-bugs-fix.py'
      - '.github/workflows/apply-three-bugs-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fix/three-bugs-checklist-inventory-house'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/three-bugs-checklist-inventory-house
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Python patches
        run: |
          set -euo pipefail
          python3 scripts/apply-three-bugs-fix.py

      - name: Commit patched sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Checklist.tsx components/Dashboard.tsx utils/supabaseRealtimeService.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          Fix empty checklist, inventory red card, show house name

          - Stringify calendar_assignment_id; return in-memory template rows if insert fails
          - AssignedTasks: house=all uses assignment house; getSubtasks(type, task.house)
          - Inventory pending count = incomplete items (keep inventory in has-pending)
          - Show house name in checklist modal, AssignedTasks row, Checklist subtitle
          EOF
          )"
          git push origin HEAD:fix/three-bugs-checklist-inventory-house
