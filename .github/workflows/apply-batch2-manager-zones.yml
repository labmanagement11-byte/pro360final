name: Apply batch2 manager zones users reminders

on:
  push:
    branches:
      - fix/manager-zones-users-reminders
    paths:
      - 'scripts/unpack-batch2-patches.py'
      - 'scripts/apply-batch2-patches.sh'
      - '.github/workflows/apply-batch2-manager-zones.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/manager-zones-users-reminders
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack and apply patches
        run: |
          set -euo pipefail
          python3 scripts/unpack-batch2-patches.py
          bash scripts/apply-batch2-patches.sh

      - name: Commit patched sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Dashboard.tsx components/Users.tsx utils/supabaseRealtimeService.ts supabase/functions/admin-users/index.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "$(cat <<'MSG'
          Managers: zones accordion, shopping/reminders, Auth users, pre-due alerts

          - HYNTIBA2/Torre checklist zones + type inference
          - Empty new-house same UI blank data
          - Managers shopping/reminders + users Auth scoped to house
          - Jonathan-only password view; reminders 7-day pre-due alerts
          MSG
          )"
          git push origin HEAD:fix/manager-zones-users-reminders
