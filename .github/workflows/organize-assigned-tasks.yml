name: Organize assigned tasks

on:
  push:
    branches:
      - feat/organize-assigned-tasks
    paths:
      - scripts/organize-assigned-tasks.py
      - scripts/organize-assigned-tasks.py.b64
      - scripts/assemble-organize-script.py
      - .github/workflows/organize-assigned-tasks.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble patch script
        run: python3 scripts/assemble-organize-script.py
      - name: Patch Dashboard
        run: python3 scripts/organize-assigned-tasks.py
      - name: Commit Dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Dashboard.tsx scripts/organize-assigned-tasks.py
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Organiza Tareas Asignadas por zona con mejor contraste"
          git push
