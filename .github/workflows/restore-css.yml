name: Restore Dashboard CSS

on:
  push:
    paths:
      - '.github/workflows/restore-css.yml'
      - 'scripts/css-restore/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build single Dashboard.css from p1-p8
        run: |
          set -euo pipefail
          : > components/Dashboard.css
          for i in 1 2 3 4 5 6 7 8; do
            f="components/Dashboard.p${i}.css"
            if [ ! -f "$f" ]; then
              echo "Missing $f"
              exit 1
            fi
            size=$(wc -c < "$f")
            if [ "$size" -lt 100 ]; then
              echo "Stub too small: $f ($size)"
              exit 1
            fi
            cat "$f" >> components/Dashboard.css
            printf '\n' >> components/Dashboard.css
          done
          wc -c components/Dashboard.css
          grep -q -- '--color-primary' components/Dashboard.css
          grep -q 'cl-admin-type-tabs' components/Dashboard.css
          if head -n 20 components/Dashboard.css | grep -q "@import"; then
            echo "Unexpected @import left in Dashboard.css"
            exit 1
          fi

      - name: Remove split chunks and commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            components/Dashboard.p1.css \
            components/Dashboard.p2.css \
            components/Dashboard.p3.css \
            components/Dashboard.p4.css \
            components/Dashboard.p5.css \
            components/Dashboard.p6.css \
            components/Dashboard.p7.css \
            components/Dashboard.p8.css \
            components/Dashboard.part1.css || true
          git add components/Dashboard.css
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Restore single full Dashboard.css (no @import chunks)"
          git push
