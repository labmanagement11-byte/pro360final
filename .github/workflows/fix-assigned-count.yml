name: Fix assigned count label

on:
  push:
    branches:
      - feat/organize-assigned-tasks
    paths:
      - scripts/fix-assigned-count.py
      - .github/workflows/fix-assigned-count.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix count span
        run: python3 scripts/fix-assigned-count.py
      - name: Commit Dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Dashboard.tsx
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Muestra el conteo de tareas por zona"
          git push
