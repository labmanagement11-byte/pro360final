name: Apply P1 checklist/login/users fixes
on:
  push:
    branches: [fix/p1-checklist-login-users]
    paths:
      - 'scripts/p1-patches/**'
      - 'scripts/apply-p1-fixes.py'
      - '.github/workflows/apply-p1-fixes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-checklist-login-users
          fetch-depth: 0
      - name: Apply patches
        run: python3 scripts/apply-p1-fixes.py
      - name: Commit and push if changed
        run: |
          git config user.name "labmanagement11-byte"
          git config user.email "labmanagement1.1@gmail.com"
          git add components/Dashboard.tsx components/Login.tsx components/Login.css components/Users.tsx utils/supabaseRealtimeService.ts
          if git diff --staged --quiet; then
            echo "No file changes after apply (maybe already applied)."
            exit 0
          fi
          git commit -m "Apply P1: checklist delete, login errors, manager Usuarios, inventory red gate"
          git push origin HEAD:fix/p1-checklist-login-users
