name: Apply P1 fixes
on:
  workflow_dispatch:
  push:
    branches: [fix/p1-checklist-login-users]
    paths:
      - 'scripts/bootstrap-apply-p1.py'
      - 'scripts/p1-patches/**'
      - '.github/workflows/apply-p1-fixes.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-checklist-login-users
          fetch-depth: 0
      - name: Bootstrap and apply P1
        run: python3 scripts/bootstrap-apply-p1.py
      - name: Commit and push
        run: |
          git config user.name "labmanagement11-byte"
          git config user.email "labmanagement1.1@gmail.com"
          git add components/Dashboard.tsx components/Login.tsx components/Login.css components/Users.tsx utils/supabaseRealtimeService.ts || true
          if git diff --staged --quiet; then echo none; exit 0; fi
          git commit -m "Apply P1: checklist delete, login errors, manager Usuarios, inventory red gate"
          git push origin HEAD:fix/p1-checklist-login-users
